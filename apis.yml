aid: orbital-materials
name: Orbital Materials
description: 'Orbital Materials (rebranded Orbital Industries in 2026) is an AI industrial
  company founded in 2022 by Jonathan Godwin, a former DeepMind researcher, with offices
  in London and San Francisco. It applies frontier AI to the discovery, testing and
  deployment of advanced materials and to the hardware and manufacturing built around
  them, co-designing materials and hardware together rather than sequentially. Its public
  technical output is a family of open-source machine-learned interatomic potentials —
  the Orb, Orb-v2/v3 and OrbMol foundation models for atomic simulation — distributed as
  the Apache-2.0 licensed `orb-models` Python package on PyPI and GitHub and as model
  weights on Hugging Face. Its internal platform, CurieOS, and its Orbital IT data-center
  module business are marketed through a contact form rather than a developer program.
  The company publishes no public HTTP API, developer portal, or machine-readable API
  contract of any kind.'
