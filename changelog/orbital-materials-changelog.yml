entries:
- version: v0.7.0
  date: '2026-05-26'
  breaking: true
  highlights:
  - Release of OrbMol-v2, adding a CoulombModule for long-range electrostatics on top of
    the OrbMol architecture (direct Coulomb summation for non-periodic systems, Particle
    Mesh Ewald via nvalchemiops for periodic systems); trained on OMol25 and OPoly26.
  - GSCDB138 Normalized Error Ratio drops from 6.05 to 1.62.
  - Full-model compilation — model.compile(...) now wraps the full regressor for all
    models, ~1.7x speedup at 10k atoms on a single 80 GB GPU.
  breaking_changes:
  - model.predict(...)["energy"] now returns fp64 by default to preserve kJ/mol
    resolution against OMol-scale references; pass fp64_energy=False to opt out.
  source: https://github.com/orbital-materials/orb-models/releases/tag/v0.7.0
